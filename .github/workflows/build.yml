# Test the project, build the Windows desktop bundle, and publish tagged releases.
name: build

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
      - "*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python setup.py deps
          .\.venv\Scripts\python.exe -m pip install -e .
      - name: Check dependencies
        run: .\.venv\Scripts\python.exe setup.py check
      - name: Run source self-test
        run: .\.venv\Scripts\python.exe flet_main.py --self-test
      - name: Lint
        run: .\.venv\Scripts\python.exe -m ruff check rpgmv_decrypter flet_app tests flet_main.py build_flet.py setup.py
      - name: Run tests
        run: .\.venv\Scripts\python.exe -m pytest -q

  build:
    name: build Windows application
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python setup.py deps
          .\.venv\Scripts\python.exe -m pip install -e .
      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $version = .\.venv\Scripts\python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"
      - name: Build executable and ZIP
        run: .\.venv\Scripts\python.exe build_flet.py
      - name: Verify packaged executable
        shell: pwsh
        run: |
          $exe = "dist-flet\RPGMakerDecrypterFlet\RPGMakerDecrypterFlet.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing $exe" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged self-test failed with exit code $LASTEXITCODE" }
      - name: Upload packaged ZIP
        uses: actions/upload-artifact@v6
        with:
          name: RPGMakerDecrypter-windows-x64
          path: dist-flet/RPGMakerDecrypter-*-windows-x64.zip
          retention-days: 14
          if-no-files-found: error
  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged ZIP
        uses: actions/download-artifact@v6
        with:
          name: RPGMakerDecrypter-windows-x64
          path: release
      - name: Check tag against project version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ needs.build.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} says $tag but pyproject.toml says $version" >&2
            exit 1
          fi
          echo "tag and project agree: $version"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: release/RPGMakerDecrypter-*-windows-x64.zip
          generate_release_notes: true
          body: |
            Download the ZIP, extract it, and run `RPGMakerDecrypterFlet.exe`.

            Keep the entire folder together: the executable needs the adjacent
            `_internal` folder. On first launch the application creates a portable
            `.runtime` folder beside the executable.

            The bundled application includes its Python and Flet/Flutter runtime;
            no separate Python installation is required.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}